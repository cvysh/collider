[project]
name = "collider"
version = "0.1.0"
description = "Interactive CERN Open Data + ML laboratory"
requires-python = ">=3.12"
# Runtime dependencies of the *deployed service* only. The API serves
# precomputed artifacts and imports nothing heavier than Pydantic, so the
# training and ingestion stack is not installed in production: it would add
# ~1 GB of uproot, matplotlib and XGBoost for code the server never runs.
dependencies = [
    "pydantic>=2.9",    # typed, validated event schema at the API boundary
    "fastapi>=0.115",   # API layer: typed request/response, OpenAPI for TS codegen
    "uvicorn>=0.32",    # ASGI server
]

[project.optional-dependencies]
# Everything that reads CERN data, trains models and makes figures. Needed to
# reproduce the pipeline and to run the tests; never needed to serve the API.
pipeline = [
    "uproot>=5.7",      # read ROOT files in pure Python, no ROOT/C++ install
    "awkward>=2",       # jagged arrays: variable-length objects per event
    "numpy>=2",
    "matplotlib>=3.9",  # histograms for EDA
    "hist>=2.8",        # histogram objects with physics-friendly binning
    "aiohttp>=3.10",    # fsspec HTTP backend: lets uproot stream ROOT files from CERN
    "requests>=2.32",   # same, plus plain downloads
    "scikit-learn>=1.5",# baseline models, metrics, preprocessing
    "xgboost>=2.1",     # gradient-boosted trees, the standard tabular strong baseline
]
dev = [
    "collider[pipeline]",
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6",     # notebooks
    "httpx>=0.27",      # FastAPI TestClient transport
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collider"]
