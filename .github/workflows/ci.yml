name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # Includes the physics validation: the dimuon spectrum must reproduce
      # the J/psi, Upsilon and Z masses from real ATLAS data. If this fails,
      # the four-vector arithmetic or unit convention is wrong and no
      # downstream result can be trusted.
      - name: Tests
        run: pytest -v
