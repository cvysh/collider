name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # The runner's system Python is externally managed, so --system is
      # refused. Install into a venv and reach it through `uv run`.
      - name: Install project
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Includes the physics validation: the dimuon spectrum must reproduce
      # the J/psi, Upsilon and Z masses from real ATLAS data. If this fails,
      # the four-vector arithmetic or unit convention is wrong and no
      # downstream result can be trusted.
      - name: Tests
        run: uv run pytest -v

  # The frontend deploys to Vercel on push. Without this job a type error only
  # surfaces when Vercel builds, by which point main already holds the break.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Pinned to the Node version the Vercel projects actually run (checked
      # with `vercel project inspect`), not to whatever is on the developer's
      # machine: this job exists to predict the deploy, so a mismatch here
      # would let CI pass on something the deploy then rejects.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `ci`, not `install`: installs the lockfile exactly and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Two files under web/lib are generated from sources outside web/:
      # lib/api-types.ts from docs/openapi.json, and lib/dialogue.json from
      # assets/dialogue/lines.json. Both are committed, so both can go stale.
      # A stale api-types.ts still compiles -- it is a coherent description of
      # an API that no longer exists -- and deploys, which is the failure this
      # step exists to catch.
      #
      # It must run BEFORE the build: `prebuild` invokes sync:dialogue, which
      # would quietly repair the drift and let the build pass.
      - name: Generated files match their sources
        run: |
          npm run sync:types
          npm run sync:dialogue
          if ! git diff --exit-code -- lib/api-types.ts lib/dialogue.json; then
            echo "::error::web/lib is stale. Run 'npm run sync:types && npm run sync:dialogue' in web/ and commit the result."
            exit 1
          fi

      - name: Build
        run: npm run build
